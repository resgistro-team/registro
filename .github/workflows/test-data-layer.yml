name: Data layer tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: registro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d registro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run database tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/registro_test
        run: python -m pytest tests -q
# Deployment settings for Vercel. Local development uses requirements.txt.
[project]
name = "registro-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
]

[tool.vercel]
# server.py builds the MCP server; `app` is its HTTP form, with sign-in.
entrypoint = "server:app"
